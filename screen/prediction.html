<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediction</title>
    <link rel="stylesheet" href="../style/prediction.css" />
    <link rel="icon" type="image/png" href="./image/icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <section class="prediction-form">
        <div  class="prediction-form-heading">
        <h1>AI Diabetes Prediction</h1>
        <p>Fill in the patient's medical details below to predict the likehood of diabetes using Machine Learning.</p>
        </div>
        <div class="prediction-form-details">
            <div class="prediction-form-details-div">
                <label>Name</label>
                <input type="text" placeholder="Enter Your Name" />
            </div>
            <div class="prediction-form-details-div">
                <label>Gender</label>
                <select>
                    <option>Male</option>
                    <option>Female</option>
                </select>
            </div>
            <div class="prediction-form-details-div">
                <label>Age</label>
                <input type="text" placeholder="Enter Your Age" />
            </div>
            <div class="prediction-form-details-div">
                <label>BMI</label>
                <input type="text" placeholder="Enter Your BMI" />
            </div>
            <div class="prediction-form-details-div">
                <label>HbA1c Level</label>
                <input type="number" placeholder="Enter Your Name" />
            </div>
            <div class="prediction-form-details-div">
                <label>Blood Glucose</label>
                <input type="number" placeholder="Enter Your Name" />
            </div>
            <div class="prediction-form-details-div">
                <label>Smoking History</label>
                <select>
                    <option>Never</option>
                    <option>Former</option>
                    <option>Current</option>
                    <option>Not Current</option>
                    <option>No info</option>
                </select>
            </div>
            <div class="prediction-form-details-div">
                <label>Hypertension</label>
                <select>
                    <option>No</option>
                    <option>Yes</option>
                </select>
            </div>
            <div class="prediction-form-details-div">
                <label>Heart Disease</label>
                <select>
                    <option>No</option>
                    <option>Yes</option>  
                </select>
            </div>
            
        </div>
        <button class="prediction-form-button">Predict Diabetes</button>
    </section>
    
</body>
</html>
